<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendSmart</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f9f9f9;
            color: #333;
        }
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #2563eb; /* Primary color from your app */
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .app-name {
            font-size: 28px;
            font-weight: 600;
            color: #2563eb; /* Primary color from your app */
        }
        .loading {
            margin-top: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading-circle {
            width: 12px;
            height: 12px;
            margin: 0 6px;
            border-radius: 50%;
            background-color: #2563eb;
            animation: bounce 1.5s infinite ease-in-out;
        }
        .loading-circle:nth-child(1) {
            animation-delay: 0s;
        }
        .loading-circle:nth-child(2) {
            animation-delay: 0.3s;
        }
        .loading-circle:nth-child(3) {
            animation-delay: 0.6s;
        }
        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo">SS</div>
        <div class="app-name">SpendSmart</div>
    </div>
    <div class="loading">
        <div class="loading-circle"></div>
        <div class="loading-circle"></div>
        <div class="loading-circle"></div>
    </div>

    <script>
        // Redirect to the main app after a short delay
        setTimeout(() => {
            window.location.href = '/';
        }, 2000);
    </script>
</body>
</html>
